networks:
  movie-network:
    driver: bridge

services:
  movie_service:
    build:
      context: ./movies-crud
      dockerfile: Dockerfile
    environment:
      DB_HOST: movie_db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: moviesdb
    depends_on:
      movie_db:
        condition: service_healthy
    # Do not publish application ports; Kong is the public entry point.
    networks:
      - movie-network

  reviews_service:
    build:
      context: ./movies-reviews
      dockerfile: Dockerfile
    environment:
      DB_HOST: movie_db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: moviesdb
    depends_on:
      movie_db:
        condition: service_healthy
    networks:
      - movie-network

  recommendation_service:
    build:
      context: ./movies-recommendation
      dockerfile: Dockerfile
    depends_on:
      movie_db:
        condition: service_healthy
    networks:
      - movie-network
    
  movie_db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=moviesdb
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d moviesdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - movie-network

  kong:
    image: kong:3.9
    environment:
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/etc/kong/kong.yml
      - KONG_PROXY_ACCESS_LOG=/dev/stdout
      - KONG_ADMIN_ACCESS_LOG=/dev/stdout
      - KONG_PROXY_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_LISTEN=0.0.0.0:8001
    volumes:
      - ./kong.yml:/etc/kong/kong.yml
    ports:
      - 8000:8000
      - 8443:8443
    networks:
      - movie-network

